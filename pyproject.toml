[project]
name = "torch-jepa"
version = "0.1.0"
description = "Framework to create and train JEPAs in Pytorch"
readme = "README.md"
authors = [
    { name = "Sattwik Kumar Sahu", email = "sattwik21@iiserb.ac.in" }
]
requires-python = ">=3.10"
dependencies = [
    "tensordict>=0.12.4",
    "torch>=2.12.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "ipython>=8.39.0",
    "marimo>=0.23.8",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.42",
]
plot = [
    "matplotlib>=3.10.9",
    "plotly>=6.7.0",
    "seaborn>=0.13.2",
]
train = [
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "omegaconf>=2.3.0",
]
